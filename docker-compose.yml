services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilotpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d pilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pilot:pilotpass@db:5432/pilot
    ports:
      - "8000:8000"

volumes:
  pgdata:
